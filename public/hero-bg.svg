<svg width="664" height="665" viewBox="0 0 664 665" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flutterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54C5F8"/>
      <stop offset="100%" stop-color="#01579B"/>
    </linearGradient>
    <linearGradient id="dartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0175C2"/>
      <stop offset="100%" stop-color="#13B9FD"/>
    </linearGradient>
    <linearGradient id="firebaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feFlood flood-color="rgba(255,255,255,0.1)"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Grid lines -->
  <g opacity="0.15" stroke="url(#flutterGrad)" stroke-width="0.5">
    <line x1="332" y1="0" x2="332" y2="665"/>
    <line x1="0" y1="332" x2="664" y2="332"/>
    <line x1="166" y1="0" x2="166" y2="665"/>
    <line x1="498" y1="0" x2="498" y2="665"/>
    <line x1="0" y1="166" x2="664" y2="166"/>
    <line x1="0" y1="498" x2="664" y2="498"/>
    <circle cx="332" cy="332" r="150" fill="none"/>
    <circle cx="332" cy="332" r="250" fill="none"/>
    <circle cx="332" cy="332" r="320" fill="none"/>
  </g>

  <!-- Flutter logo - center -->
  <g transform="translate(282, 282)" filter="url(#glow)">
    <rect x="0" y="0" width="100" height="100" rx="18" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
    <g transform="translate(20, 15)">
      <path d="M35 0L0 35L11 46L57 0H35Z" fill="url(#flutterGrad)"/>
      <path d="M35 35L11 59L22 70L35 57L57 35H35Z" fill="url(#flutterGrad)"/>
      <path d="M11 46L22 57L35 44V35L11 46Z" fill="#54C5F8" fill-opacity="0.7"/>
    </g>
  </g>

  <!-- Dart logo - top right -->
  <g transform="translate(420, 100)" filter="url(#cardBlur)">
    <rect x="0" y="0" width="80" height="80" rx="14" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
    <g transform="translate(18, 18)">
      <path d="M0 32L10 42L42 10L32 0L0 32Z" fill="url(#dartGrad)"/>
      <path d="M10 42L20 42L42 20V10L10 42Z" fill="#0175C2"/>
      <path d="M32 0L42 10L42 20L32 10V0Z" fill="#13B9FD" fill-opacity="0.8"/>
    </g>
  </g>

  <!-- Firebase logo - bottom left -->
  <g transform="translate(120, 450)" filter="url(#cardBlur)">
    <rect x="0" y="0" width="80" height="80" rx="14" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
    <g transform="translate(22, 12)">
      <path d="M0 45L8 5L16 20L20 14L36 45H0Z" fill="url(#firebaseGrad)"/>
      <path d="M8 5L0 45L20 28L8 5Z" fill="#FFA000" fill-opacity="0.8"/>
      <path d="M16 20L20 14L20 28L16 20Z" fill="#F57C00"/>
    </g>
  </g>

  <!-- Android icon - top left -->
  <g transform="translate(100, 140)" filter="url(#cardBlur)">
    <rect x="0" y="0" width="70" height="70" rx="12" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
    <g transform="translate(17, 18)">
      <path d="M6 4L4 0M30 4L32 0" stroke="#3DDC84" stroke-width="2" stroke-linecap="round"/>
      <path d="M0 18C0 10 8 4 18 4C28 4 36 10 36 18V32H0V18Z" fill="#3DDC84"/>
      <circle cx="10" cy="16" r="3" fill="white"/>
      <circle cx="26" cy="16" r="3" fill="white"/>
    </g>
  </g>

  <!-- iOS/Apple icon - bottom right -->
  <g transform="translate(480, 420)" filter="url(#cardBlur)">
    <rect x="0" y="0" width="70" height="70" rx="12" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
    <g transform="translate(20, 12)">
      <path d="M15 8C15 4 18 0 22 0C22 4 19 8 15 8Z" fill="white"/>
      <path d="M8 46C4 46 0 38 0 28C0 18 6 14 10 14C12 14 14 15 16 15C18 15 20 14 22 14C26 14 32 18 32 28C32 38 28 46 24 46C22 46 20 45 18 45C16 45 14 46 12 46C10 46 8 46 8 46Z" fill="white"/>
    </g>
  </g>

  <!-- Git icon - middle left -->
  <g transform="translate(60, 290)" filter="url(#cardBlur)">
    <rect x="0" y="0" width="65" height="65" rx="11" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
    <g transform="translate(14, 14)">
      <path d="M36 17L20 1C19 0 17 0 16 1L13 4L17 8C18 7 20 8 21 9C22 10 22 12 21 13L25 17C26 16 28 17 29 18C30 20 29 22 27 23C25 24 23 23 22 21C21 20 21 18 22 17L18 13V24C19 25 19 27 18 28C16 30 14 29 13 27C12 25 13 23 15 22V13C14 12 13 11 13 9L9 5L1 13C0 14 0 16 1 17L17 33C18 34 20 34 21 33L36 18C37 17 37 15 36 14V17Z" fill="#F05032"/>
    </g>
  </g>

  <!-- VS Code icon - middle right -->
  <g transform="translate(520, 260)" filter="url(#cardBlur)">
    <rect x="0" y="0" width="65" height="65" rx="11" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
    <g transform="translate(14, 14)">
      <path d="M27 0L27 36L36 32V4L27 0Z" fill="#007ACC"/>
      <path d="M27 0L10 14L0 6V30L10 22L27 36V0Z" fill="#007ACC" fill-opacity="0.8"/>
      <path d="M10 14L27 0V8L10 20V14Z" fill="#1F9CF0"/>
    </g>
  </g>

  <!-- SQLite icon - top center -->
  <g transform="translate(270, 50)" filter="url(#cardBlur)">
    <rect x="0" y="0" width="60" height="60" rx="10" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
    <g transform="translate(12, 10)">
      <ellipse cx="18" cy="6" rx="16" ry="5" fill="#003B57"/>
      <path d="M2 6V34C2 37 9 40 18 40C27 40 34 37 34 34V6" fill="none" stroke="#003B57" stroke-width="3"/>
      <ellipse cx="18" cy="34" rx="16" ry="5" fill="#003B57"/>
    </g>
  </g>

  <!-- Bloc icon - bottom center -->
  <g transform="translate(290, 530)" filter="url(#cardBlur)">
    <rect x="0" y="0" width="60" height="60" rx="10" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
    <g transform="translate(8, 8)">
      <rect x="0" y="0" width="44" height="44" rx="10" fill="url(#flutterGrad)"/>
      <text x="22" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="white">B</text>
    </g>
  </g>

  <!-- Figma icon - left bottom -->
  <g transform="translate(180, 380)" filter="url(#cardBlur)">
    <rect x="0" y="0" width="55" height="55" rx="9" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
    <g transform="translate(14, 8)">
      <circle cx="7" cy="7" r="6" fill="#F24E1E"/>
      <circle cx="20" cy="7" r="6" fill="#FF7262"/>
      <circle cx="7" cy="20" r="6" fill="#A259FF"/>
      <circle cx="20" cy="20" r="6" fill="#1ABCFE"/>
      <circle cx="7" cy="33" r="6" fill="#0ACF83"/>
    </g>
  </g>

  <!-- Postman/API icon - right top -->
  <g transform="translate(500, 170)" filter="url(#cardBlur)">
    <rect x="0" y="0" width="55" height="55" rx="9" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
    <g transform="translate(10, 10)">
      <circle cx="17" cy="17" r="15" fill="#FF6C37"/>
      <path d="M10 17L17 10L24 17L17 24L10 17Z" fill="white"/>
    </g>
  </g>
</svg>
