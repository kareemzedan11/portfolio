<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="uiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#581c87"/>
      <stop offset="100%" style="stop-color:#7e22ce"/>
    </linearGradient>
    <linearGradient id="phone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#uiBg)"/>
  
  <!-- Decorative shapes -->
  <circle cx="350" cy="50" r="60" fill="#a855f7" opacity="0.3"/>
  <circle cx="50" cy="250" r="80" fill="#c084fc" opacity="0.2"/>
  <rect x="300" y="200" width="100" height="100" rx="20" fill="#d946ef" opacity="0.15" transform="rotate(15, 350, 250)"/>
  
  <!-- Phone mockup 1 -->
  <g transform="translate(80, 60)">
    <rect x="0" y="0" width="80" height="150" rx="10" fill="url(#phone)"/>
    <rect x="5" y="15" width="70" height="120" rx="5" fill="#1e1b4b"/>
    <rect x="10" y="25" width="60" height="20" rx="3" fill="#4338ca"/>
    <rect x="10" y="50" width="40" height="8" rx="2" fill="#6366f1"/>
    <rect x="10" y="62" width="55" height="6" rx="2" fill="#818cf8" opacity="0.5"/>
    <rect x="10" y="72" width="45" height="6" rx="2" fill="#818cf8" opacity="0.5"/>
    <circle cx="40" cy="100" r="15" fill="#8b5cf6"/>
    <rect x="30" y="5" width="20" height="4" rx="2" fill="#374151"/>
  </g>
  
  <!-- Phone mockup 2 -->
  <g transform="translate(180, 40)">
    <rect x="0" y="0" width="90" height="170" rx="12" fill="url(#phone)"/>
    <rect x="5" y="18" width="80" height="135" rx="6" fill="#312e81"/>
    <rect x="12" y="30" width="66" height="35" rx="4" fill="#4f46e5"/>
    <rect x="12" y="72" width="45" height="10" rx="3" fill="#7c3aed"/>
    <rect x="12" y="88" width="60" height="8" rx="2" fill="#a78bfa" opacity="0.6"/>
    <rect x="12" y="100" width="50" height="8" rx="2" fill="#a78bfa" opacity="0.6"/>
    <rect x="12" y="120" width="66" height="25" rx="5" fill="#8b5cf6"/>
    <rect x="35" y="6" width="20" height="5" rx="2" fill="#374151"/>
  </g>
  
  <!-- Phone mockup 3 -->
  <g transform="translate(290, 70)">
    <rect x="0" y="0" width="75" height="140" rx="10" fill="url(#phone)"/>
    <rect x="5" y="15" width="65" height="110" rx="5" fill="#3b0764"/>
    <circle cx="37" cy="50" r="20" fill="#9333ea"/>
    <rect x="12" y="80" width="50" height="8" rx="2" fill="#a855f7"/>
    <rect x="12" y="92" width="40" height="6" rx="2" fill="#c084fc" opacity="0.5"/>
    <rect x="12" y="102" width="50" height="15" rx="4" fill="#7c3aed"/>
    <rect x="27" y="5" width="20" height="4" rx="2" fill="#374151"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">Cross-Platform Flutter UI</text>
  <text x="200" y="275" font-family="Arial, sans-serif" font-size="12" fill="#d8b4fe" text-anchor="middle">Responsive " Animated " Adaptive</text>
</svg>
