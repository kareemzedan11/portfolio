<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 500px;
      height: 300px;
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .phone {
      background: #1f2937;
      border-radius: 20px;
      padding: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .phone.center {
      transform: scale(1.1);
      z-index: 2;
    }
    .phone.side {
      opacity: 0.9;
    }
    .screen {
      width: 90px;
      height: 180px;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
    }
    .screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }
    .notch {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 6px;
      background: #374151;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="phone side">
    <div class="screen">
      <img src="capital-taxi-2.png" alt="Screen 1">
    </div>
  </div>
  <div class="phone center">
    <div class="screen">
      <img src="capital-taxi-1.png" alt="Screen 2">
    </div>
  </div>
  <div class="phone side">
    <div class="screen">
      <img src="capital-taxi-6.png" alt="Screen 3">
    </div>
  </div>
</body>
</html>
