<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="taxiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#374151"/>
      <stop offset="100%" style="stop-color:#1f2937"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#taxiBg)"/>
  
  <!-- City silhouette -->
  <rect x="20" y="120" width="40" height="100" fill="#78350f" opacity="0.3"/>
  <rect x="70" y="100" width="50" height="120" fill="#78350f" opacity="0.3"/>
  <rect x="130" y="140" width="35" height="80" fill="#78350f" opacity="0.3"/>
  <rect x="280" y="110" width="45" height="110" fill="#78350f" opacity="0.3"/>
  <rect x="335" y="130" width="50" height="90" fill="#78350f" opacity="0.3"/>
  
  <!-- Road -->
  <rect x="0" y="220" width="400" height="80" fill="url(#road)"/>
  <rect x="0" y="255" width="30" height="4" fill="#fbbf24"/>
  <rect x="50" y="255" width="30" height="4" fill="#fbbf24"/>
  <rect x="100" y="255" width="30" height="4" fill="#fbbf24"/>
  <rect x="150" y="255" width="30" height="4" fill="#fbbf24"/>
  <rect x="200" y="255" width="30" height="4" fill="#fbbf24"/>
  <rect x="250" y="255" width="30" height="4" fill="#fbbf24"/>
  <rect x="300" y="255" width="30" height="4" fill="#fbbf24"/>
  <rect x="350" y="255" width="30" height="4" fill="#fbbf24"/>
  
  <!-- Taxi car -->
  <rect x="140" y="200" width="120" height="45" rx="10" fill="#fef3c7"/>
  <rect x="150" y="185" width="80" height="25" rx="8" fill="#fef3c7"/>
  <circle cx="170" cy="250" r="15" fill="#1f2937"/>
  <circle cx="170" cy="250" r="8" fill="#6b7280"/>
  <circle cx="230" cy="250" r="15" fill="#1f2937"/>
  <circle cx="230" cy="250" r="8" fill="#6b7280"/>
  <rect x="155" y="190" width="25" height="15" fill="#7dd3fc" opacity="0.7"/>
  <rect x="200" y="190" width="25" height="15" fill="#7dd3fc" opacity="0.7"/>
  
  <!-- Taxi sign -->
  <rect x="175" y="172" width="50" height="15" rx="3" fill="#fbbf24"/>
  <text x="200" y="183" font-family="Arial" font-size="9" font-weight="bold" fill="#78350f" text-anchor="middle">TAXI</text>
  
  <!-- Location pin -->
  <path d="M320 80 C320 60, 350 60, 350 80 C350 95, 335 110, 335 110 C335 110, 320 95, 320 80" fill="#ef4444"/>
  <circle cx="335" cy="78" r="6" fill="#fff"/>
  
  <!-- Title -->
  <text x="200" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#78350f" text-anchor="middle">CAPITAL TAXI</text>
  <text x="200" y="75" font-family="Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle">Ride-hailing App</text>
</svg>
