<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="fireBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="50%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#fde047"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#fireBg)"/>
  
  <!-- Decorative circles -->
  <circle cx="50" cy="50" r="80" fill="#4338ca" opacity="0.2"/>
  <circle cx="350" cy="250" r="100" fill="#6366f1" opacity="0.15"/>
  
  <!-- Firebase flame icon -->
  <g transform="translate(160, 80)">
    <path d="M20 120 L40 0 L50 40 L70 20 L80 120 L50 100 Z" fill="url(#fireGrad)"/>
    <path d="M30 100 L40 60 L50 80 L60 50 L70 100 L50 85 Z" fill="#ea580c"/>
  </g>
  
  <!-- Flutter bird hint -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="30" height="30" rx="4" fill="#02569B" transform="rotate(45, 15, 15)"/>
    <rect x="20" y="10" width="20" height="20" rx="3" fill="#45D1FD" transform="rotate(45, 30, 20)"/>
  </g>
  
  <!-- Cloud icons -->
  <g fill="#fff" opacity="0.2">
    <ellipse cx="80" cy="180" rx="25" ry="15"/>
    <ellipse cx="95" cy="175" rx="20" ry="12"/>
    <ellipse cx="320" cy="100" rx="30" ry="18"/>
    <ellipse cx="340" cy="95" rx="22" ry="14"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">Firebase Flutter</text>
  <text x="200" y="265" font-family="Arial, sans-serif" font-size="14" fill="#a5b4fc" text-anchor="middle">Auth " Firestore " Cloud Messaging</text>
</svg>
